{% extends "base.html" %}

{% load static %}

{% block head %}

{% endblock %}

{% block title %}新しいパスワードの設定{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/password_reset_from_key.css' %}">
<div class="container mt-5">
    <h2>新しいパスワードの設定</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">パスワードを変更する</button>
    </form>
</div>
{% endblock %}
