{% extends "base.html" %}
{% load static %}

{% block head %}

{% endblock %}

{% block title %}メールアドレス確認{% endblock %}


{% block content %}
<link rel="stylesheet" href="{% static 'css/email.css' %}">
<div class="container mt-5">
    <h2>メールアドレス確認</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">確認メールを送信</button>
    </form>
</div>
{% endblock %}
