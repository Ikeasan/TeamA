{% extends "base.html" %}

{% load static %}

{% block head %}

{% endblock %}

{% block title %}パスワードリセット{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/password_reset.css' %}">
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center">パスワードリセット</h2>
        <p>登録したメールアドレスを入力してください。リセット手順をお送りします。</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">リセットリンクを送信</button>
        </form>
    </div>
</div>
{% endblock %}
