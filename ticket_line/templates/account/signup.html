{% extends "base.html" %}

{% load static %}

{% block head %}

{% endblock %}

{% block title %}新規登録{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/signup.css' %}">

<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center">新規登録</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">登録</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'account_login' %}">既にアカウントをお持ちですか？ログイン</a>
        </div>
    </div>
</div>
{% endblock %}
